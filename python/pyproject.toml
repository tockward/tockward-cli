[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tockward"
version = "0.3.0"
description = "Heartbeat client for Tockward: know when your cron jobs, scripts and devices go silent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Tockward", email = "support@tockward.com" }]
keywords = ["cron", "monitoring", "heartbeat", "backup", "dead-mans-switch", "cronjob", "alerting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Monitoring",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://tockward.com"
Source = "https://github.com/tockward/tockward-cli"
Issues = "https://github.com/tockward/tockward-cli/issues"

[project.scripts]
tockward = "tockward.__main__:main"
